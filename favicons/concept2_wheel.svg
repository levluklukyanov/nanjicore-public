<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Базовый градиент фона -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#18122B"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Неоновое свечение колеса -->
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Золотой градиент стрелочки -->
    <linearGradient id="pointerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Свечение кнопки -->
    <filter id="btnShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Фон: суперэллипс (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad2)"/>
  <rect x="24" y="24" width="464" height="464" rx="128" fill="none" stroke="#6366f1" stroke-width="5" stroke-opacity="0.4"/>

  <!-- Внешний светящийся обод колеса -->
  <circle cx="256" cy="270" r="168" fill="none" stroke="#818cf8" stroke-width="8" opacity="0.3" filter="url(#glow2)"/>
  <circle cx="256" cy="270" r="160" fill="#1e1b4b" stroke="#4f46e5" stroke-width="6"/>

  <!-- 6 секторов Колеса Фортуны (фирменные цвета Nanjicore) -->
  <g id="wheelSlices" transform="rotate(-30 256 270)">
    <!-- Сектор 1: Индиго (#6366f1) -->
    <path d="M256 270 L256 114 A156 156 0 0 1 391 192 Z" fill="#6366f1"/>
    <!-- Сектор 2: Розовый (#ec4899) -->
    <path d="M256 270 L391 192 A156 156 0 0 1 391 348 Z" fill="#ec4899"/>
    <!-- Сектор 3: Изумруд (#10b981) -->
    <path d="M256 270 L391 348 A156 156 0 0 1 256 426 Z" fill="#10b981"/>
    <!-- Сектор 4: Янтарь (#f59e0b) -->
    <path d="M256 270 L256 426 A156 156 0 0 1 121 348 Z" fill="#f59e0b"/>
    <!-- Сектор 5: Небесно-голубой (#06b6d4) -->
    <path d="M256 270 L121 348 A156 156 0 0 1 121 192 Z" fill="#06b6d4"/>
    <!-- Сектор 6: Фиолетовый (#8b5cf6) -->
    <path d="M256 270 L121 192 A156 156 0 0 1 256 114 Z" fill="#8b5cf6"/>
  </g>

  <!-- Внутренние разделители спиц -->
  <circle cx="256" cy="270" r="156" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Центральная кнопка-кликер -->
  <circle cx="256" cy="270" r="48" fill="#ffffff" filter="url(#btnShadow2)"/>
  <circle cx="256" cy="270" r="40" fill="#f8fafc"/>
  <circle cx="256" cy="270" r="28" fill="#6366f1"/>
  <circle cx="256" cy="270" r="12" fill="#ffffff"/>

  <!-- Верхний треугольный указатель (Pointer) со свечением -->
  <g filter="url(#glow2)">
    <polygon points="256,128 232,76 280,76" fill="url(#pointerGrad2)"/>
    <circle cx="256" cy="76" r="12" fill="#fef08a"/>
  </g>
</svg>
