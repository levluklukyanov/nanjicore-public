<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Фон: темный неон -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1f1147"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Золотой градиент короны -->
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Рубиновый градиент кристалла -->
    <linearGradient id="rubyGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Неоновое свечение -->
    <filter id="crownGlow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фон: суперэллипс (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad4)"/>
  <rect x="24" y="24" width="464" height="464" rx="128" fill="none" stroke="#f59e0b" stroke-width="5" stroke-opacity="0.5"/>

  <!-- Золотистая аура -->
  <circle cx="256" cy="256" r="150" fill="#f59e0b" opacity="0.15" filter="url(#crownGlow4)"/>

  <!-- 8-Bit / Pixel Корона Чемпиона Nanjicore -->
  <g filter="url(#crownGlow4)">
    <!-- Базовое полотно короны -->
    <path d="M112 368 L400 368 L400 328 L376 328 L376 256 L336 296 L288 176 L256 144 L224 176 L176 296 L136 256 L136 328 L112 328 Z" fill="url(#goldGrad4)"/>

    <!-- Пиксельные золотые зубцы наверху -->
    <!-- Левый зубец -->
    <rect x="120" y="232" width="32" height="32" fill="#fef08a"/>
    <!-- Центральный высший зубец -->
    <rect x="240" y="128" width="32" height="32" fill="#ffffff"/>
    <rect x="240" y="96" width="32" height="32" fill="#fef08a"/>
    <!-- Правый зубец -->
    <rect x="360" y="232" width="32" height="32" fill="#fef08a"/>

    <!-- Нижняя полоса обруча короны -->
    <rect x="112" y="344" width="288" height="24" fill="#92400e"/>
    <rect x="128" y="348" width="256" height="16" fill="#f59e0b"/>

    <!-- Центральный Рубин короны (Символ победы) -->
    <polygon points="256,232 284,268 256,304 228,268" fill="url(#rubyGrad4)"/>
    <polygon points="256,242 272,268 256,294 240,268" fill="#ffffff" opacity="0.6"/>

    <!-- Боковые драгоценные камни (Изумруд и Сапфир) -->
    <rect x="164" y="348" width="16" height="16" fill="#10b981"/>
    <rect x="248" y="348" width="16" height="16" fill="#ef4444"/>
    <rect x="332" y="348" width="16" height="16" fill="#38bdf8"/>
  </g>
</svg>
