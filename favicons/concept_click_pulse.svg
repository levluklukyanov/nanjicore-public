<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Чистый темный сквиркл -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="#0f172a"/>
  <rect x="32" y="32" width="448" height="448" rx="120" fill="none" stroke="#334155" stroke-width="8"/>

  <!-- Внешнее кольцо импульса (импульс клика с 4 вырезами) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#6366f1" stroke-width="24" stroke-dasharray="190 45" stroke-linecap="round"/>

  <!-- Среднее кольцо кликера -->
  <circle cx="256" cy="256" r="105" fill="none" stroke="#8b5cf6" stroke-width="20" stroke-opacity="0.8"/>

  <!-- Внутренняя активная кнопка клика (Изумрудно-индиговая) -->
  <circle cx="256" cy="256" r="70" fill="#10b981"/>

  <!-- Центральная яркая вспышка клика -->
  <circle cx="256" cy="256" r="42" fill="#ffffff"/>
  <circle cx="256" cy="256" r="20" fill="#0f172a"/>

  <!-- 4 метки прицела (Швейцарский минимализм) -->
  <line x1="256" y1="56" x2="256" y2="82" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="430" x2="256" y2="456" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <line x1="56" y1="256" x2="82" y2="256" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <line x1="430" y1="256" x2="456" y2="256" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
</svg>
