<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест прозрачного колеса</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: sans-serif;
      background: #333;
      color: #fff;
    }
    .grid {
      display: flex;
      gap: 40px;
      margin-bottom: 40px;
    }
    .card {
      padding: 30px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .dark-card {
      background: #18181b;
      border: 1px solid #27272a;
    }
    .light-card {
      background: #f4f4f5;
      color: #18181b;
      border: 1px solid #e4e4e7;
    }
    .tab-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-radius: 8px;
    }
    .tab-dark { background: #202124; color: #e8eaed; }
    .tab-light { background: #dee1e6; color: #202124; }
  </style>
</head>
<body>
  <h2>Предпросмотр фавиконки «Fortune Wheel» БЕЗ черного фона (прозрачный)</h2>
  
  <div class="grid">
    <!-- Темный фон (вкладка Chrome в Dark Mode) -->
    <div class="card dark-card">
      <h3>Темная тема вкладки браузера</h3>
      <div class="tab-bar tab-dark">
        <img id="prev-dark-16" width="16" height="16">
        <span>Nanjicore (16px)</span>
      </div>
      <div class="tab-bar tab-dark">
        <img id="prev-dark-32" width="32" height="32">
        <span>Nanjicore (32px)</span>
      </div>
      <img id="prev-dark-128" width="128" height="128">
    </div>

    <!-- Светлый фон (вкладка Chrome в Light Mode) -->
    <div class="card light-card">
      <h3>Светлая тема вкладки браузера</h3>
      <div class="tab-bar tab-light">
        <img id="prev-light-16" width="16" height="16">
        <span>Nanjicore (16px)</span>
      </div>
      <div class="tab-bar tab-light">
        <img id="prev-light-32" width="32" height="32">
        <span>Nanjicore (32px)</span>
      </div>
      <img id="prev-light-128" width="128" height="128">
    </div>
  </div>

  <script>
    const svgCode = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Обод колеса с тонким темным контуром для контраста на светлых и темных вкладках -->
  <circle cx="256" cy="270" r="198" fill="#0f172a"/>
  
  <!-- 6 плоских секторов Колеса Фортуны Nanjicore -->
  <g transform="rotate(-30 256 270)">
    <!-- Сектор 1: Индиго -->
    <path d="M256 270 L256 80 A190 190 0 0 1 421 175 Z" fill="#6366f1" stroke="#0f172a" stroke-width="4"/>
    <!-- Сектор 2: Розовый -->
    <path d="M256 270 L421 175 A190 190 0 0 1 421 365 Z" fill="#ec4899" stroke="#0f172a" stroke-width="4"/>
    <!-- Сектор 3: Изумрудный -->
    <path d="M256 270 L421 365 A190 190 0 0 1 256 460 Z" fill="#10b981" stroke="#0f172a" stroke-width="4"/>
    <!-- Сектор 4: Янтарный -->
    <path d="M256 270 L256 460 A190 190 0 0 1 91 365 Z" fill="#f59e0b" stroke="#0f172a" stroke-width="4"/>
    <!-- Сектор 5: Циан -->
    <path d="M256 270 L91 365 A190 190 0 0 1 91 175 Z" fill="#06b6d4" stroke="#0f172a" stroke-width="4"/>
    <!-- Сектор 6: Фиолетовый -->
    <path d="M256 270 L91 175 A190 190 0 0 1 256 80 Z" fill="#8b5cf6" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- Внутренняя ступица/кнопка колеса -->
  <circle cx="256" cy="270" r="54" fill="#0f172a"/>
  <circle cx="256" cy="270" r="44" fill="#ffffff"/>
  <circle cx="256" cy="270" r="24" fill="#6366f1"/>

  <!-- Верхний указатель колеса (Pointer) с аккуратным контуром -->
  <polygon points="256,104 220,32 292,32" fill="#0f172a"/>
  <polygon points="256,98 226,38 286,38" fill="#f59e0b"/>
  <polygon points="256,86 234,44 278,44" fill="#fef08a"/>
</svg>`;

    const b64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgCode)));
    ['prev-dark-16', 'prev-dark-32', 'prev-dark-128', 'prev-light-16', 'prev-light-32', 'prev-light-128'].forEach(id => {
      document.getElementById(id).src = b64;
    });
  </script>
</body>
</html>
