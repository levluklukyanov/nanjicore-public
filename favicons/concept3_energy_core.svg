<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Фон: глубокий темный космос -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#140c26"/>
      <stop offset="100%" stop-color="#0d041a"/>
    </linearGradient>

    <!-- Грани кристалла: фиолетово-малиновый неон -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <linearGradient id="facetBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Фильтр магического сияния -->
    <filter id="coreAura3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="sunGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Фон: суперэллипс (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad3)"/>
  <rect x="24" y="24" width="464" height="464" rx="128" fill="none" stroke="#a855f7" stroke-width="5" stroke-opacity="0.4"/>

  <!-- Фоновое гало -->
  <circle cx="256" cy="256" r="180" fill="url(#sunGlow3)"/>

  <!-- 3D Гексагональный Кристалл Ядра (Energy Core) -->
  <g filter="url(#coreAura3)">
    <!-- Верхняя грань -->
    <polygon points="256,96 368,176 256,256 144,176" fill="url(#facetTop)"/>
    <!-- Левая нижняя грань -->
    <polygon points="144,176 256,256 256,416 144,336" fill="url(#facetLeft)"/>
    <!-- Правая нижняя грань -->
    <polygon points="256,256 368,176 368,336 256,416" fill="url(#facetRight)"/>
    <!-- Центральное ребро преломления -->
    <line x1="256" y1="256" x2="256" y2="416" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6"/>
  </g>

  <!-- Внутреннее сияющее мини-ядро (Сверхновая звезда) -->
  <polygon points="256,200 286,240 256,280 226,240" fill="#ffffff" filter="url(#coreAura3)"/>
  <circle cx="256" cy="240" r="8" fill="#fbcfe8"/>

  <!-- Внешние защитные рунические орбиты -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="16 24" stroke-opacity="0.5"/>
</svg>
