<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Чистый темный сквиркл -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="#0f172a"/>
  <rect x="32" y="32" width="448" height="448" rx="120" fill="none" stroke="#334155" stroke-width="8"/>

  <!-- Изометрический Кубик Рандома (Шестиугольник 3 граней) -->
  <!-- 1. Верхняя грань (Светло-индиговая) -->
  <polygon points="256,104 380,176 256,248 132,176" fill="#818cf8"/>
  <!-- Точка на верхней грани (1 точка по центру) -->
  <ellipse cx="256" cy="176" rx="22" ry="14" fill="#ffffff"/>

  <!-- 2. Левая грань (Насыщенный индиго) -->
  <polygon points="132,176 256,248 256,392 132,320" fill="#6366f1"/>
  <!-- Точки на левой грани (2 точки по диагонали) -->
  <ellipse cx="174" cy="226" rx="14" ry="20" fill="#ffffff"/>
  <ellipse cx="214" cy="342" rx="14" ry="20" fill="#ffffff"/>

  <!-- 3. Правая грань (Глубокий фиолетовый) -->
  <polygon points="256,248 380,176 380,320 256,392" fill="#4f46e5"/>
  <!-- Точки на правой грани (3 точки по диагонали) -->
  <ellipse cx="298" cy="342" rx="14" ry="20" fill="#ffffff"/>
  <ellipse cx="318" cy="284" rx="14" ry="20" fill="#ffffff"/>
  <ellipse cx="338" cy="226" rx="14" ry="20" fill="#ffffff"/>

  <!-- Внутренние четкие грани куба -->
  <line x1="256" y1="248" x2="256" y2="392" stroke="#0f172a" stroke-width="4"/>
  <line x1="256" y1="248" x2="132" y2="176" stroke="#0f172a" stroke-width="4"/>
  <line x1="256" y1="248" x2="380" y2="176" stroke="#0f172a" stroke-width="4"/>
</svg>
