<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Чистый темный сквиркл -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="#0f172a"/>
  <rect x="32" y="32" width="448" height="448" rx="120" fill="none" stroke="#334155" stroke-width="8"/>

  <!-- Внешний аккуратный контур колеса -->
  <circle cx="256" cy="270" r="164" fill="#1e293b"/>

  <!-- 6 плоских секторов Колеса Фортуны (фирменные чистые цвета) -->
  <g transform="rotate(-30 256 270)">
    <!-- Сектор 1: Индиго -->
    <path d="M256 270 L256 114 A156 156 0 0 1 391 192 Z" fill="#6366f1"/>
    <!-- Сектор 2: Розовый -->
    <path d="M256 270 L391 192 A156 156 0 0 1 391 348 Z" fill="#ec4899"/>
    <!-- Сектор 3: Изумрудный -->
    <path d="M256 270 L391 348 A156 156 0 0 1 256 426 Z" fill="#10b981"/>
    <!-- Сектор 4: Янтарный -->
    <path d="M256 270 L256 426 A156 156 0 0 1 121 348 Z" fill="#f59e0b"/>
    <!-- Сектор 5: Циан / Голубой -->
    <path d="M256 270 L121 348 A156 156 0 0 1 121 192 Z" fill="#06b6d4"/>
    <!-- Сектор 6: Фиолетовый -->
    <path d="M256 270 L121 192 A156 156 0 0 1 256 114 Z" fill="#8b5cf6"/>
  </g>

  <!-- Внутренняя чистая кнопка-кликер -->
  <circle cx="256" cy="270" r="46" fill="#0f172a"/>
  <circle cx="256" cy="270" r="38" fill="#ffffff"/>
  <circle cx="256" cy="270" r="20" fill="#6366f1"/>

  <!-- Верхний плотный треугольный указатель (Pointer) -->
  <polygon points="256,132 230,80 282,80" fill="#f59e0b"/>
  <polygon points="256,120 238,84 274,84" fill="#fef08a"/>
</svg>
