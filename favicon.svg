<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Обод колеса с тонким темным контуром для идеального контраста на светлых и темных вкладках -->
  <circle cx="256" cy="270" r="198" fill="#0f172a"/>
  
  <!-- 6 плоских секторов Колеса Фортуны Nanjicore -->
  <g transform="rotate(-30 256 270)">
    <!-- Сектор 1: Индиго -->
    <path d="M256 270 L256 80 A190 190 0 0 1 421 175 Z" fill="#6366f1" stroke="#0f172a" stroke-width="4"/>
    <!-- Сектор 2: Розовый -->
    <path d="M256 270 L421 175 A190 190 0 0 1 421 365 Z" fill="#ec4899" stroke="#0f172a" stroke-width="4"/>
    <!-- Сектор 3: Изумрудный -->
    <path d="M256 270 L421 365 A190 190 0 0 1 256 460 Z" fill="#10b981" stroke="#0f172a" stroke-width="4"/>
    <!-- Сектор 4: Янтарный -->
    <path d="M256 270 L256 460 A190 190 0 0 1 91 365 Z" fill="#f59e0b" stroke="#0f172a" stroke-width="4"/>
    <!-- Сектор 5: Циан -->
    <path d="M256 270 L91 365 A190 190 0 0 1 91 175 Z" fill="#06b6d4" stroke="#0f172a" stroke-width="4"/>
    <!-- Сектор 6: Фиолетовый -->
    <path d="M256 270 L91 175 A190 190 0 0 1 256 80 Z" fill="#8b5cf6" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- Внутренняя ступица/кнопка колеса -->
  <circle cx="256" cy="270" r="54" fill="#0f172a"/>
  <circle cx="256" cy="270" r="44" fill="#ffffff"/>
  <circle cx="256" cy="270" r="24" fill="#6366f1"/>

  <!-- Верхний указатель колеса (Pointer) с аккуратным контуром -->
  <polygon points="256,104 220,32 292,32" fill="#0f172a"/>
  <polygon points="256,98 226,38 286,38" fill="#f59e0b"/>
  <polygon points="256,86 234,44 278,44" fill="#fef08a"/>
</svg>
